<!DOCTYPE html>
<html lang="vi" dir="ltr">

<head>
    <meta charset="utf-8">
    <title>Reveal Deleted FB Message</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="header">
        <h2>RVDFM - Xem Tin Nhắn Đã Gỡ</h2>
        <div class="stats">
            <span class="badge blue">Đã lưu: <b id="saved-count">0</b></span>
            <span class="badge red">Thu hồi: <b id="unsent-count">0</b></span>
        </div>
    </div>

    <div class="toolbar">
        <input type="text" id="search-input" placeholder="Tìm trong tin nhắn đã lưu..." />
        <select id="filter-type">
            <option value="all">Tất cả</option>
            <option value="unsent">Chỉ tin thu hồi</option>
        </select>
        <button id="clear-btn" title="Xóa bộ nhớ tin nhắn đã lưu">Xóa</button>
    </div>

    <div id="msg-list" class="msg-list">
        <div class="empty">Chưa có tin nhắn nào được lưu.</div>
    </div>

    <details class="guide-box">
        <summary>Hướng dẫn & Thông tin</summary>
        <p class="highlight">Nội dung tin nhắn thu hồi sẽ hiện trực tiếp ngay tại khung chat (hỗ trợ cả chữ, trả lời, ảnh, video, âm thanh, nhãn dán).</p>
        <img src="../screenshots/new.png" alt="" style="width: 240px; border-radius: 8px;">
        <p class="author">
            Source: <a href="https://github.com/HoangTran0410/RevealDeletedFBMessages" target="_blank">Github/HoangTran0410</a>
        </p>
    </details>

    <script src="popup.js"></script>
</body>

</html>
